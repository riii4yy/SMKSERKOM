<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>Hotspot Riii4yy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#5c1a2b;
    --wine-deep:#3d0f1c;
    --gold:#c9a24b;
    --gold-light:#e6c877;
    --ivory:#f6efe2;
    --parchment:#efe4cf;
    --ink:#2c1810;
    --error:#8a2e2e;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{
    color-scheme: light;
  }

  html,body{
    height:100%;
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(ellipse at top left, rgba(230,200,119,0.10), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(230,200,119,0.08), transparent 55%),
      linear-gradient(160deg, var(--wine-deep) 0%, var(--wine) 55%, var(--wine-deep) 100%);
    overflow-x:hidden;
  }

  /* subtle ornamental wifi-signal watermark in the background */
  .bg-signal{
    position:fixed;
    inset:0;
    z-index:0;
    opacity:0.06;
    background-repeat:no-repeat;
    background-position:center;
    background-size:min(900px, 140vw);
    pointer-events:none;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg, var(--ivory), var(--parchment));
    border:1px solid var(--gold);
    border-radius:6px;
    box-shadow:
      0 0 0 1px rgba(201,162,75,0.35),
      0 30px 60px rgba(0,0,0,0.45);
    padding:40px 34px 30px;
    text-align:center;
  }

  .signal-icon{
    width:52px;
    height:52px;
    margin:0 auto 14px;
    display:block;
  }

  .signal-icon path{
    stroke:var(--gold);
    fill:none;
    stroke-width:2.2;
    stroke-linecap:round;
  }
  .signal-icon circle{
    fill:var(--wine);
  }

  .brand{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.5px;
    color:var(--wine);
    line-height:1.2;
  }

  .divider{
    width:64px;
    height:1px;
    background:var(--gold);
    margin:14px auto 16px;
  }

  .welcome{
    font-size:18px;
    line-height:1.5;
    color:var(--ink);
  }
  .welcome b{
    color:var(--wine);
    font-weight:600;
  }

  form{
    margin-top:26px;
    text-align:left;
  }

  .field{
    margin-bottom:18px;
  }

  .field label{
    display:block;
    font-size:15px;
    letter-spacing:0.3px;
    color:var(--wine);
    margin-bottom:6px;
  }

  .field-input{
    position:relative;
  }

  .field-input input{
    width:100%;
    padding:11px 14px;
    font-family:'Cormorant Garamond', serif;
    font-size:17px;
    border:1px solid #c9b892;
    border-radius:4px;
    background:#fffdf8;
    color:var(--ink);
    outline:none;
    color-scheme: light;
    -webkit-text-fill-color:var(--ink);
    caret-color:var(--ink);
    transition:border-color .2s, box-shadow .2s;
  }

  .field-input input::placeholder{
    color:#a08f6a;
    opacity:1;
  }

  .field-input input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,75,0.18);
  }

  /* cegah autofill browser memaksa warna gelap di HP */
  .field-input input:-webkit-autofill,
  .field-input input:-webkit-autofill:hover,
  .field-input input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--ink);
    -webkit-box-shadow:0 0 0 1000px #fffdf8 inset;
    box-shadow:0 0 0 1000px #fffdf8 inset;
    caret-color:var(--ink);
    transition:background-color 9999s ease-in-out 0s;
  }

  .field-input input#password{
    padding-right:44px;
  }

  .toggle-pass{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    padding:4px;
    line-height:0;
  }

  .toggle-pass svg{
    width:20px;
    height:20px;
    stroke:var(--wine);
    fill:none;
    stroke-width:1.6;
  }

  .btn-login{
    width:100%;
    margin-top:8px;
    padding:12px;
    font-family:'Playfair Display', serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.6px;
    color:var(--ivory);
    background:linear-gradient(180deg, #b98f3a, var(--wine));
    border:1px solid var(--gold);
    border-radius:4px;
    cursor:pointer;
    transition:filter .2s, transform .1s;
  }

  .btn-login:hover{ filter:brightness(1.08); }
  .btn-login:active{ transform:translateY(1px); }

  .error-box{
    margin-top:16px;
    padding:9px 12px;
    background:rgba(138,46,46,0.08);
    border:1px solid var(--error);
    border-radius:4px;
    color:var(--error);
    font-size:15px;
  }

  footer{
    margin-top:26px;
    font-size:13px;
    letter-spacing:0.4px;
    color:#8a7550;
  }

  footer span{
    color:var(--wine);
    font-weight:600;
  }

  @media (max-width:420px){
    .card{ padding:32px 22px 24px; }
    .brand{ font-size:24px; }
  }
</style>
</head>
<body>

<div class="bg-signal" style="background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><g fill=%22none%22 stroke=%22%23e6c877%22 stroke-width=%222%22 stroke-linecap=%22round%22><path d=%22M30 120 a100 100 0 0 1 140 0%22/><path d=%22M55 140 a65 65 0 0 1 90 0%22/><path d=%22M80 160 a30 30 0 0 1 40 0%22/></g><circle cx=%22100%22 cy=%22178%22 r=%226%22 fill=%22%23e6c877%22/></svg>')"></div>

<div class="card">

  <svg class="signal-icon" viewBox="0 0 64 64">
    <path d="M8 26 C22 10 42 10 56 26"/>
    <path d="M18 34 C27 24 37 24 46 34"/>
    <path d="M27 42 C31 38 33 38 37 42"/>
    <circle cx="32" cy="50" r="3.4"/>
  </svg>

  <div class="brand">Hotspot Riii4yy</div>
  <div class="divider"></div>
  <div class="welcome">
    Selamat datang di<br>
    <b>SMK PGRI BRATI</b>
  </div>

  <form name="sendin" action="$(link-login-only)" method="post" onsubmit="return doLogin()">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
    <input type="hidden" name="chap-id" value="$(chap-id)">
    <input type="hidden" name="chap-challenge" value="$(chap-challenge)">

    <div class="field">
      <label for="username">Username</label>
      <div class="field-input">
        <input type="text" name="username" id="username" placeholder="Masukkan username" autocomplete="off" autocapitalize="off" required>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="field-input">
        <input type="password" name="password" id="password" placeholder="Masukkan password" autocomplete="off" required>
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password">
          <svg id="eyeIcon" viewBox="0 0 24 24">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-login">Login</button>

    $(if error)
    <div class="error-box">$(error)</div>
    $(endif)
  </form>

  <footer>Powered By <span>Ridwan.serkom</span></footer>
</div>

<script>
  var toggle = document.getElementById('togglePass');
  var pass = document.getElementById('password');
  var icon = document.getElementById('eyeIcon');

  var eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
  var eyeClosed = '<path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M6.7 6.7C4 8.3 2 12 2 12s4 7 11 7c1.6 0 3-.3 4.2-.8"/><path d="M17.4 17.4C19.7 15.9 22 12 22 12s-1.6-2.8-4.4-4.8"/>';

  toggle.addEventListener('click', function(){
    if(pass.type === 'password'){
      pass.type = 'text';
      icon.innerHTML = eyeClosed;
      toggle.setAttribute('aria-label','Sembunyikan password');
    } else {
      pass.type = 'password';
      icon.innerHTML = eyeOpen;
      toggle.setAttribute('aria-label','Tampilkan password');
    }
  });
</script>

<script>
  /* Implementasi MD5 (RFC 1321) untuk menghitung CHAP response,
     dibutuhkan Mikrotik saat Server Profile memakai login method HTTP CHAP */
  function md5(str){
    function rotL(n,s){ return (n<<s)|(n>>>(32-s)); }
    function toHex(n){
      var s='', v;
      for(var i=0;i<=3;i++){ v=(n>>>(i*8))&255; s+=('0'+v.toString(16)).slice(-2); }
      return s;
    }
    function utf8(s){ return unescape(encodeURIComponent(s)); }
    function addU(x,y){
      var x4=x&0x40000000,y4=y&0x40000000,x8=x&0x80000000,y8=y&0x80000000;
      var r=(x&0x3FFFFFFF)+(y&0x3FFFFFFF);
      if(x4&y4) return r^0x80000000^x8^y8;
      if(x4|y4){ if(r&0x40000000) return r^0xC0000000^x8^y8; else return r^0x40000000^x8^y8; }
      return r^x8^y8;
    }
    function F(x,y,z){return (x&y)|((~x)&z);}
    function G(x,y,z){return (x&z)|(y&(~z));}
    function H(x,y,z){return x^y^z;}
    function I(x,y,z){return y^(x|(~z));}
    function FF(a,b,c,d,x,s,ac){a=addU(a,addU(addU(F(b,c,d),x),ac));return addU(rotL(a,s),b);}
    function GG(a,b,c,d,x,s,ac){a=addU(a,addU(addU(G(b,c,d),x),ac));return addU(rotL(a,s),b);}
    function HH(a,b,c,d,x,s,ac){a=addU(a,addU(addU(H(b,c,d),x),ac));return addU(rotL(a,s),b);}
    function II(a,b,c,d,x,s,ac){a=addU(a,addU(addU(I(b,c,d),x),ac));return addU(rotL(a,s),b);}
    function toWords(str){
      var wc, mlbw, nb=str.length;
      var nwp=((nb+8)>>>6)+1, wa=new Array(nwp*16-1), bp=0, bc=0;
      while(bc<nb){
        wc=(bc-(bc%4))/4; mlbw=(bc%4)*8;
        wa[wc]=(wa[wc]|(str.charCodeAt(bc)<<mlbw)); bc++;
      }
      wc=(bc-(bc%4))/4; mlbw=(bc%4)*8;
      wa[wc]=wa[wc]|(0x80<<mlbw);
      wa[nwp*16-2]=nb<<3; wa[nwp*16-1]=nb>>>29;
      return wa;
    }
    var x=toWords(utf8(str));
    var a=1732584193,b=-271733879,c=-1732584194,d=271733878;
    var S11=7,S12=12,S13=17,S14=22,S21=5,S22=9,S23=14,S24=20,S31=4,S32=11,S33=16,S34=23,S41=6,S42=10,S43=15,S44=21;
    for(var k=0;k<x.length;k+=16){
      var AA=a,BB=b,CC=c,DD=d;
      a=FF(a,b,c,d,x[k+0],S11,-680876936); d=FF(d,a,b,c,x[k+1],S12,-389564586);
      c=FF(c,d,a,b,x[k+2],S13,606105819); b=FF(b,c,d,a,x[k+3],S14,-1044525330);
      a=FF(a,b,c,d,x[k+4],S11,-176418897); d=FF(d,a,b,c,x[k+5],S12,1200080426);
      c=FF(c,d,a,b,x[k+6],S13,-1473231341); b=FF(b,c,d,a,x[k+7],S14,-45705983);
      a=FF(a,b,c,d,x[k+8],S11,1770035416); d=FF(d,a,b,c,x[k+9],S12,-1958414417);
      c=FF(c,d,a,b,x[k+10],S13,-42063); b=FF(b,c,d,a,x[k+11],S14,-1990404162);
      a=FF(a,b,c,d,x[k+12],S11,1804603682); d=FF(d,a,b,c,x[k+13],S12,-40341101);
      c=FF(c,d,a,b,x[k+14],S13,-1502002290); b=FF(b,c,d,a,x[k+15],S14,1236535329);
      a=GG(a,b,c,d,x[k+1],S21,-165796510); d=GG(d,a,b,c,x[k+6],S22,-1069501632);
      c=GG(c,d,a,b,x[k+11],S23,643717713); b=GG(b,c,d,a,x[k+0],S24,-373897302);
      a=GG(a,b,c,d,x[k+5],S21,-701558691); d=GG(d,a,b,c,x[k+10],S22,38016083);
      c=GG(c,d,a,b,x[k+15],S23,-660478335); b=GG(b,c,d,a,x[k+4],S24,-405537848);
      a=GG(a,b,c,d,x[k+9],S21,568446438); d=GG(d,a,b,c,x[k+14],S22,-1019803690);
      c=GG(c,d,a,b,x[k+3],S23,-187363961); b=GG(b,c,d,a,x[k+8],S24,1163531501);
      a=GG(a,b,c,d,x[k+13],S21,-1444681467); d=GG(d,a,b,c,x[k+2],S22,-51403784);
      c=GG(c,d,a,b,x[k+7],S23,1735328473); b=GG(b,c,d,a,x[k+12],S24,-1926607734);
      a=HH(a,b,c,d,x[k+5],S31,-378558); d=HH(d,a,b,c,x[k+8],S32,-2022574463);
      c=HH(c,d,a,b,x[k+11],S33,1839030562); b=HH(b,c,d,a,x[k+14],S34,-35309556);
      a=HH(a,b,c,d,x[k+1],S31,-1530992060); d=HH(d,a,b,c,x[k+4],S32,1272893353);
      c=HH(c,d,a,b,x[k+7],S33,-155497632); b=HH(b,c,d,a,x[k+10],S34,-1094730640);
      a=HH(a,b,c,d,x[k+13],S31,681279174); d=HH(d,a,b,c,x[k+0],S32,-358537222);
      c=HH(c,d,a,b,x[k+3],S33,-722521979); b=HH(b,c,d,a,x[k+6],S34,76029189);
      a=HH(a,b,c,d,x[k+9],S31,-640364487); d=HH(d,a,b,c,x[k+12],S32,-421815835);
      c=HH(c,d,a,b,x[k+15],S33,530742520); b=HH(b,c,d,a,x[k+2],S34,-995338651);
      a=II(a,b,c,d,x[k+0],S41,-198630844); d=II(d,a,b,c,x[k+7],S42,1126891415);
      c=II(c,d,a,b,x[k+14],S43,-1416354905); b=II(b,c,d,a,x[k+5],S44,-57434055);
      a=II(a,b,c,d,x[k+12],S41,1700485571); d=II(d,a,b,c,x[k+3],S42,-1894986606);
      c=II(c,d,a,b,x[k+10],S43,-1051523); b=II(b,c,d,a,x[k+1],S44,-2054922799);
      a=II(a,b,c,d,x[k+8],S41,1873313359); d=II(d,a,b,c,x[k+15],S42,-30611744);
      c=II(c,d,a,b,x[k+6],S43,-1560198380); b=II(b,c,d,a,x[k+13],S44,1309151649);
      a=II(a,b,c,d,x[k+4],S41,-145523070); d=II(d,a,b,c,x[k+11],S42,-1120210379);
      c=II(c,d,a,b,x[k+2],S43,718787259); b=II(b,c,d,a,x[k+9],S44,-343485551);
      a=addU(a,AA); b=addU(b,BB); c=addU(c,CC); d=addU(d,DD);
    }
    return (toHex(a)+toHex(b)+toHex(c)+toHex(d)).toLowerCase();
  }

  function doLogin(){
    var form = document.forms['sendin'];
    var chapId = form['chap-id'] ? form['chap-id'].value : '';
    var chapChallenge = form['chap-challenge'] ? form['chap-challenge'].value : '';
    if(chapId && chapChallenge){
      form.password.value = md5(chapId + form.password.value + chapChallenge);
    }
    return true;
  }
</script>

</body>
</html>
