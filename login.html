<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>Hotspot Riii4yy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#5c1a2b;
    --wine-deep:#3d0f1c;
    --gold:#c9a24b;
    --gold-light:#e6c877;
    --ivory:#f6efe2;
    --parchment:#efe4cf;
    --ink:#2c1810;
    --error:#8a2e2e;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{
    color-scheme: light;
  }

  html,body{
    height:100%;
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(ellipse at top left, rgba(230,200,119,0.10), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(230,200,119,0.08), transparent 55%),
      linear-gradient(160deg, var(--wine-deep) 0%, var(--wine) 55%, var(--wine-deep) 100%);
    overflow-x:hidden;
  }

  /* subtle ornamental wifi-signal watermark in the background */
  .bg-signal{
    position:fixed;
    inset:0;
    z-index:0;
    opacity:0.06;
    background-repeat:no-repeat;
    background-position:center;
    background-size:min(900px, 140vw);
    pointer-events:none;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg, var(--ivory), var(--parchment));
    border:1px solid var(--gold);
    border-radius:6px;
    box-shadow:
      0 0 0 1px rgba(201,162,75,0.35),
      0 30px 60px rgba(0,0,0,0.45);
    padding:40px 34px 30px;
    text-align:center;
  }

  .signal-icon{
    width:52px;
    height:52px;
    margin:0 auto 14px;
    display:block;
  }

  .signal-icon path{
    stroke:var(--gold);
    fill:none;
    stroke-width:2.2;
    stroke-linecap:round;
  }
  .signal-icon circle{
    fill:var(--wine);
  }

  .brand{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.5px;
    color:var(--wine);
    line-height:1.2;
  }

  .divider{
    width:64px;
    height:1px;
    background:var(--gold);
    margin:14px auto 16px;
  }

  .welcome{
    font-size:18px;
    line-height:1.5;
    color:var(--ink);
  }
  .welcome b{
    color:var(--wine);
    font-weight:600;
  }

  form{
    margin-top:26px;
    text-align:left;
  }

  .field{
    margin-bottom:18px;
  }

  .field label{
    display:block;
    font-size:15px;
    letter-spacing:0.3px;
    color:var(--wine);
    margin-bottom:6px;
  }

  .field-input{
    position:relative;
  }

  .field-input input{
    width:100%;
    padding:11px 14px;
    font-family:'Cormorant Garamond', serif;
    font-size:17px;
    border:1px solid #c9b892;
    border-radius:4px;
    background:#fffdf8;
    color:var(--ink);
    outline:none;
    color-scheme: light;
    -webkit-text-fill-color:var(--ink);
    caret-color:var(--ink);
    transition:border-color .2s, box-shadow .2s;
  }

  .field-input input::placeholder{
    color:#a08f6a;
    opacity:1;
  }

  .field-input input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,75,0.18);
  }

  /* cegah autofill browser memaksa warna gelap di HP */
  .field-input input:-webkit-autofill,
  .field-input input:-webkit-autofill:hover,
  .field-input input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--ink);
    -webkit-box-shadow:0 0 0 1000px #fffdf8 inset;
    box-shadow:0 0 0 1000px #fffdf8 inset;
    caret-color:var(--ink);
    transition:background-color 9999s ease-in-out 0s;
  }

  .field-input input#password{
    padding-right:44px;
  }

  .toggle-pass{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    padding:4px;
    line-height:0;
  }

  .toggle-pass svg{
    width:20px;
    height:20px;
    stroke:var(--wine);
    fill:none;
    stroke-width:1.6;
  }

  .btn-login{
    width:100%;
    margin-top:8px;
    padding:12px;
    font-family:'Playfair Display', serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.6px;
    color:var(--ivory);
    background:linear-gradient(180deg, #b98f3a, var(--wine));
    border:1px solid var(--gold);
    border-radius:4px;
    cursor:pointer;
    transition:filter .2s, transform .1s;
  }

  .btn-login:hover{ filter:brightness(1.08); }
  .btn-login:active{ transform:translateY(1px); }

  .error-box{
    margin-top:16px;
    padding:9px 12px;
    background:rgba(138,46,46,0.08);
    border:1px solid var(--error);
    border-radius:4px;
    color:var(--error);
    font-size:15px;
  }

  footer{
    margin-top:26px;
    font-size:13px;
    letter-spacing:0.4px;
    color:#8a7550;
  }

  footer span{
    color:var(--wine);
    font-weight:600;
  }

  @media (max-width:420px){
    .card{ padding:32px 22px 24px; }
    .brand{ font-size:24px; }
  }
</style>
</head>
<body>

<div class="bg-signal" style="background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><g fill=%22none%22 stroke=%22%23e6c877%22 stroke-width=%222%22 stroke-linecap=%22round%22><path d=%22M30 120 a100 100 0 0 1 140 0%22/><path d=%22M55 140 a65 65 0 0 1 90 0%22/><path d=%22M80 160 a30 30 0 0 1 40 0%22/></g><circle cx=%22100%22 cy=%22178%22 r=%226%22 fill=%22%23e6c877%22/></svg>')"></div>

<div class="card">

  <svg class="signal-icon" viewBox="0 0 64 64">
    <path d="M8 26 C22 10 42 10 56 26"/>
    <path d="M18 34 C27 24 37 24 46 34"/>
    <path d="M27 42 C31 38 33 38 37 42"/>
    <circle cx="32" cy="50" r="3.4"/>
  </svg>

  <div class="brand">Hotspot Riii4yy</div>
  <div class="divider"></div>
  <div class="welcome">
    Selamat datang di<br>
    <b>SMK PGRI BRATI</b>
  </div>

  <form name="sendin" action="$(link-login-only)" method="post" onsubmit="return doLogin()">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">

    <div class="field">
      <label for="username">Username</label>
      <div class="field-input">
        <input type="text" name="username" id="username" placeholder="Masukkan username" autocomplete="off" autocapitalize="off" required>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="field-input">
        <input type="password" id="password" placeholder="Masukkan password" autocomplete="off" required>
        <input type="hidden" name="password" id="password-hidden">
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password">
          <svg id="eyeIcon" viewBox="0 0 24 24">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-login">Login</button>

    $(if error)
    <div class="error-box">$(error)</div>
    $(endif)
  </form>

  <footer>Powered By <span>Ridwan.serkom</span></footer>
</div>

<script>
  var toggle = document.getElementById('togglePass');
  var pass = document.getElementById('password');
  var icon = document.getElementById('eyeIcon');

  var eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
  var eyeClosed = '<path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M6.7 6.7C4 8.3 2 12 2 12s4 7 11 7c1.6 0 3-.3 4.2-.8"/><path d="M17.4 17.4C19.7 15.9 22 12 22 12s-1.6-2.8-4.4-4.8"/>';

  toggle.addEventListener('click', function(){
    if(pass.type === 'password'){
      pass.type = 'text';
      icon.innerHTML = eyeClosed;
      toggle.setAttribute('aria-label','Sembunyikan password');
    } else {
      pass.type = 'password';
      icon.innerHTML = eyeOpen;
      toggle.setAttribute('aria-label','Tampilkan password');
    }
  });
</script>

<!-- md5.js bawaan Mikrotik: file ini SUDAH ADA di folder Files > hotspot router kamu,
     dipakai bareng-bareng oleh login.html versi default juga. Jangan dihapus. -->
<script type="text/javascript" src="md5.js"></script>
<script language="javascript">
  function doLogin(){
    var form = document.forms['sendin'];
    var plain = document.getElementById('password').value;
    if (form.username.value === ""){ form.username.focus(); return false; }
    if (plain === "" && "$(chap-id)" === ""){ document.getElementById('password').focus(); return false; }
    if ("$(chap-id)" !== ""){
      document.getElementById('password-hidden').value = hexMD5("$(chap-id)" + plain + "$(chap-challenge)");
    } else {
      document.getElementById('password-hidden').value = plain;
    }
    return true;
  }
</script>

</body>
</html>
