<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>Hotspot Ridwan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#5c1a2b;
    --wine-deep:#3d0f1c;
    --gold:#c9a24b;
    --gold-light:#e6c877;
    --ivory:#f6efe2;
    --parchment:#efe4cf;
    --ink:#2c1810;
    --error:#8a2e2e;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{
    color-scheme: light;
  }

  html,body{
    height:100%;
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(ellipse at top left, rgba(230,200,119,0.10), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(230,200,119,0.08), transparent 55%),
      linear-gradient(160deg, var(--wine-deep) 0%, var(--wine) 55%, var(--wine-deep) 100%);
    overflow-x:hidden;
  }

  .datetime{
    font-size:13px;
    letter-spacing:0.5px;
    color:#8a7550;
    margin-bottom:10px;
    font-variant-numeric: lining-nums tabular-nums;
    font-feature-settings: "lnum" 1, "tnum" 1;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg, var(--ivory), var(--parchment));
    border:1px solid transparent;
    background-image:
      linear-gradient(180deg, var(--ivory), var(--parchment)),
      linear-gradient(135deg, var(--gold-light), var(--gold) 40%, #a8823a 70%, var(--gold-light));
    background-origin:border-box;
    background-clip:padding-box, border-box;
    border-radius:6px;
    box-shadow:
      0 0 0 1px rgba(201,162,75,0.35),
      0 30px 60px rgba(0,0,0,0.45);
    padding:40px 34px 30px;
    text-align:center;
    overflow:hidden;
    animation:cardFadeIn 0.7s ease both;
  }

  @keyframes cardFadeIn{
    0%{ opacity:0; transform:translateY(14px) scale(0.98); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* partikel kelopak mawar melayang di background */
  .petals{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-5%;
    opacity:0;
    animation-name:fall;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  .petal svg{ width:100%; height:100%; display:block; }
  @keyframes fall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
    8%{ opacity:0.5; }
    50%{ transform:translate(18px, 55vh) rotate(160deg); opacity:0.4; }
    92%{ opacity:0.22; }
    100%{ transform:translate(-14px, 112vh) rotate(320deg); opacity:0; }
  }

  .signal-icon{
    width:52px;
    height:52px;
    margin:0 auto 14px;
    display:block;
  }

  .signal-icon path{
    stroke:var(--gold);
    fill:none;
    stroke-width:2.2;
    stroke-linecap:round;
  }
  .signal-icon circle{
    fill:var(--wine);
  }

  .school-badge{
    width:104px;
    height:104px;
    margin:0 auto 14px;
    display:block;
    object-fit:contain;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,0.25));
  }

  .brand{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.5px;
    color:var(--wine);
    line-height:1.2;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:14px auto 16px;
  }
  .divider .line{
    width:46px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold));
  }
  .divider .line.right{
    background:linear-gradient(90deg, var(--gold), transparent);
  }
  .divider .ornament{
    width:9px;
    height:9px;
    transform:rotate(45deg);
    border:1px solid var(--gold);
  }
  .divider .ornament::after{
    content:'';
    position:absolute;
  }

  .welcome{
    font-size:18px;
    line-height:1.5;
    color:var(--ink);
  }
  .welcome b{
    color:var(--wine);
    font-weight:600;
  }

  form{
    margin-top:26px;
    text-align:left;
  }

  .field{
    margin-bottom:18px;
  }

  .field label{
    display:block;
    font-size:15px;
    letter-spacing:0.3px;
    color:var(--wine);
    margin-bottom:6px;
  }

  .field-input{
    position:relative;
  }

  .field-input input{
    width:100%;
    padding:11px 14px;
    font-family:'Cormorant Garamond', serif;
    font-size:17px;
    border:1px solid #c9b892;
    border-radius:4px;
    background:#fffdf8;
    color:var(--ink);
    outline:none;
    color-scheme: light;
    -webkit-text-fill-color:var(--ink);
    caret-color:var(--ink);
    font-variant-numeric: lining-nums tabular-nums;
    font-feature-settings: "lnum" 1, "tnum" 1;
    transition:border-color .2s, box-shadow .2s;
  }

  .field-input input::placeholder{
    color:#a08f6a;
    opacity:1;
  }

  .field-input input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,75,0.18);
  }

  /* cegah autofill browser memaksa warna gelap di HP */
  .field-input input:-webkit-autofill,
  .field-input input:-webkit-autofill:hover,
  .field-input input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--ink);
    -webkit-box-shadow:0 0 0 1000px #fffdf8 inset;
    box-shadow:0 0 0 1000px #fffdf8 inset;
    caret-color:var(--ink);
    transition:background-color 9999s ease-in-out 0s;
  }

  .field-input input#password{
    padding-right:44px;
  }

  .toggle-pass{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    padding:4px;
    line-height:0;
  }

  .toggle-pass svg{
    width:20px;
    height:20px;
    stroke:var(--wine);
    fill:none;
    stroke-width:1.6;
    transition:stroke .2s;
  }
  .toggle-pass.active svg{
    stroke:#1f8a4d;
  }

  .btn-login{
    width:100%;
    margin-top:8px;
    padding:12px;
    font-family:'Playfair Display', serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.6px;
    color:var(--ivory);
    background:linear-gradient(180deg, #b98f3a, var(--wine));
    border:1px solid var(--gold);
    border-radius:4px;
    cursor:pointer;
    transition:filter .2s, transform .1s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
  }

  .btn-login:hover{ filter:brightness(1.08); }
  .btn-login:active{ transform:translateY(1px); }
  .btn-login:disabled{ cursor:default; filter:brightness(0.92); }

  .spinner{
    width:16px;
    height:16px;
    border:2px solid rgba(246,239,226,0.35);
    border-top-color:var(--ivory);
    border-radius:50%;
    display:none;
    animation:spin 0.7s linear infinite;
  }
  .btn-login.loading .spinner{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .error-box{
    margin-top:16px;
    padding:9px 12px;
    background:rgba(138,46,46,0.08);
    border:1px solid var(--error);
    border-radius:4px;
    color:var(--error);
    font-size:15px;
  }

  footer{
    margin-top:26px;
    font-size:13px;
    letter-spacing:0.4px;
    color:#8a7550;
  }

  footer span{
    color:var(--wine);
    font-weight:600;
  }

  .school-address{
    margin-top:6px;
    font-size:11.5px;
    color:#a89878;
    letter-spacing:0.2px;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:14px;
  }

  .socials a{
    display:flex;
    align-items:center;
    gap:6px;
    color:#8a7550;
    text-decoration:none;
    font-size:12.5px;
    font-variant-numeric: lining-nums tabular-nums;
    font-feature-settings: "lnum" 1, "tnum" 1;
    transition:color .2s;
  }

  .socials a:hover{ color:var(--wine); }

  .socials svg{
    width:18px;
    height:18px;
    fill:var(--gold);
  }

  .btn-admin{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    margin-top:20px;
    padding:11px;
    font-family:'Cormorant Garamond', serif;
    font-size:15.5px;
    font-weight:600;
    letter-spacing:0.3px;
    color:#1f7a4d;
    background:#e8f5ee;
    border:1px solid #8fc9a8;
    border-radius:20px;
    text-decoration:none;
    transition:background .2s, filter .2s;
  }
  .btn-admin:hover{ background:#d9f0e4; }
  .btn-admin svg{
    width:19px;
    height:19px;
    fill:#25a75d;
  }

  @media (max-width:420px){
    .card{ padding:32px 22px 24px; }
    .brand{ font-size:24px; }
  }
</style>
</head>

<script>
  /* jam & tanggal real-time */
  (function(){
    var hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    var bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    var dtEl = document.getElementById('datetime');
    function pad(n){ return n < 10 ? '0'+n : n; }
    function tick(){
      var d = new Date();
      var teks = hari[d.getDay()] + ', ' + d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear() + ' \u2022 ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      dtEl.textContent = teks;
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>

<script>
  /* generate partikel kelopak mawar melayang */
  (function(){
    var container = document.getElementById('petals');
    var petalPath = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2 C18 6 18 14 12 20 C6 14 6 6 12 2 Z" fill="%23e6c877"/></svg>';
    var n = 18;
    for(var i=0;i<n;i++){
      var p = document.createElement('div');
      p.className = 'petal';
      var size = 14 + Math.random()*16;
      var left = Math.random()*100;
      var duration = 14 + Math.random()*12;
      var delay = Math.random()*-24;
      p.style.width = size+'px';
      p.style.height = size+'px';
      p.style.left = left+'vw';
      p.style.animationDuration = duration+'s';
      p.style.animationDelay = delay+'s';
      p.innerHTML = petalPath.replace('%23', '#');
      container.appendChild(p);
    }
  })();
</script>

<script>
  var toggle = document.getElementById('togglePass');
  var pass = document.getElementById('password');
  var icon = document.getElementById('eyeIcon');

  var eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
  var eyeClosed = '<path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M6.7 6.7C4 8.3 2 12 2 12s4 7 11 7c1.6 0 3-.3 4.2-.8"/><path d="M17.4 17.4C19.7 15.9 22 12 22 12s-1.6-2.8-4.4-4.8"/>';

  toggle.addEventListener('click', function(){
    if(pass.type === 'password'){
      pass.type = 'text';
      icon.innerHTML = eyeOpen;
      toggle.classList.add('active');
      toggle.setAttribute('aria-label','Sembunyikan password');
    } else {
      pass.type = 'password';
      icon.innerHTML = eyeClosed;
      toggle.classList.remove('active');
      toggle.setAttribute('aria-label','Tampilkan password');
    }
  });
</script>

<script language="javascript">
  function doLogin(){
    var form = document.forms['sendin'];
    var plain = document.getElementById('password').value;
    if (form.username.value === ""){ form.username.focus(); return false; }
    if (plain === "" && "$(chap-id)" === ""){ document.getElementById('password').focus(); return false; }
    if ("$(chap-id)" !== ""){
      document.getElementById('password-hidden').value = hexMD5("$(chap-id)" + plain + "$(chap-challenge)");
    } else {
      document.getElementById('password-hidden').value = plain;
    }
    var btn = document.getElementById('btnLogin');
    btn.classList.add('loading');
    btn.disabled = true;
    document.getElementById('btnLabel').textContent = 'Memproses...';
    return true;
  }
</script>
